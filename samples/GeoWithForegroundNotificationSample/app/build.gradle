apply plugin: 'com.android.application'

android {
    namespace 'com.swrve.sdk.geo.sample'
    compileSdk 36

    defaultConfig {
        applicationId "com.swrve.sdk.geo.sample"
        minSdkVersion 23
        targetSdkVersion 35
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint {
        abortOnError false
    }
}

dependencies {
    api 'com.google.android.material:material:1.0.0'
    api 'com.swrve.sdk.android:swrve-firebase:12.2.0'
    api 'com.swrve.sdk.android:swrve-geo:7.2.1'
}
