plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
}

android {
    namespace 'com.swrve.sdk.sample.pushinbox'
    compileSdk 36

    defaultConfig {
        applicationId "com.swrve.sdk.sample.pushinbox"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        // Needed only by the local-source switch — see settings.gradle.
        //missingDimensionStrategy 'swrve-sdk', 'core'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
    }
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.activity.compose

    implementation platform(libs.compose.bom)
    implementation libs.compose.ui
    implementation libs.compose.material3
    implementation libs.compose.material.icons.core
    implementation libs.compose.ui.tooling.preview
    debugImplementation libs.compose.ui.tooling
    implementation libs.coil.compose

    implementation libs.swrve.core
}
