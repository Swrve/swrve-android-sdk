plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.google.services)
}

android {
    namespace 'com.swrve.sdk.sample.pushnotification'
    compileSdk 36

    defaultConfig {
        applicationId "com.swrve.sdk.sample.pushnotification"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        // Needed only by the local-source switch — see settings.gradle.
        //missingDimensionStrategy 'swrve-sdk', 'firebase'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
    }
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.activity.compose

    implementation platform(libs.compose.bom)
    implementation libs.compose.ui
    implementation libs.compose.material3
    implementation libs.compose.ui.tooling.preview
    debugImplementation libs.compose.ui.tooling

    // In your app, include the Swrve SDK using the following dependency.
    // Use 'swrve-firebase' for Google FCM push, 'swrve-huawei' for Huawei HMS, or 'swrve' for no push support.
    implementation libs.swrve.firebase
}
