plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.google.services)
}

android {
    namespace 'com.swrve.sdk.sample.multiplepushproviders'
    compileSdk 36

    defaultConfig {
        applicationId "com.swrve.sdk.sample.multiplepushproviders"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        // Needed only by the local-source switch — see settings.gradle.
        //missingDimensionStrategy 'swrve-sdk', 'firebase'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
    }
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.activity.compose

    implementation platform(libs.compose.bom)
    implementation libs.compose.ui
    implementation libs.compose.material3
    implementation libs.compose.ui.tooling.preview
    debugImplementation libs.compose.ui.tooling

    // This sample declares its own FirebaseMessagingService, so it depends on firebase-messaging directly rather than relying on it arriving transitively.
    implementation libs.firebase.messaging

    // Your other push provider goes here. MyFirebaseMessagingService then decides which SDK handles each incoming message.
    // implementation 'com.your-push-provider:their-sdk:1.2.3'

    implementation libs.swrve.firebase
}
