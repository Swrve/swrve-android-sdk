version: 2.1

executors:
  swrve-executor:
    docker:
      - image: cimg/android:2026.08.1
    resource_class: xlarge

jobs:
  build:
    executor: swrve-executor
    steps:
      - checkout
      - restore_cache:
          key: jars-{{ checksum "gradle.properties" }}-{{ checksum "build.gradle" }}-{{ checksum "SwrveSDK/build.gradle" }}-{{ checksum "SwrveSDKCommon/build.gradle" }}-{{ checksum "SwrveSDKTest/build.gradle" }}
      - run:
          name: Build and Test SwrveSDKTest Firebase flavour
          command: ./gradlew :SwrveSDKTest:testFirebaseDebug
      - store_artifacts:
          path: SwrveSDKTest/build/reports/
          destination: reports
      - store_test_results:
          path: SwrveSDKTest/build/test-results/
      - save_cache:
          paths:
            - ~/.gradle
          key: jars-{{ checksum "gradle.properties" }}-{{ checksum "build.gradle" }}-{{ checksum "SwrveSDK/build.gradle" }}-{{ checksum "SwrveSDKCommon/build.gradle" }}-{{ checksum "SwrveSDKTest/build.gradle" }}
